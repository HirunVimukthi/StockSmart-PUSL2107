<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockSmart Store</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand">StockSmart Store</div><div><span>Customer</span><button class="secondary" onclick="logout()">Logout</button></div></header>
<main class="container"><h1>Products</h1><div class="grid" id="products"></div></main>
<script src="api.js"></script><script>
requireRole(["customer"]);
api("/api/products").then(products=>{document.getElementById("products").innerHTML=products.map(p=>`<article class="card"><h3>${p.name}</h3><p>${p.category}</p><strong>$${p.unit_price.toFixed(2)}</strong><p>${p.stock_qty>0?"In stock":"Out of stock"}</p></article>`).join("")}).catch(e=>alert(e.message));
</script></body></html>
