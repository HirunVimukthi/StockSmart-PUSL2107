<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockSmart Login</title><link rel="stylesheet" href="style.css"></head>
<body><main class="login-wrap"><section class="card login-card">
<h1>StockSmart</h1><p>Enterprise retail operations</p>
<form id="loginForm"><label>Email</label><input id="email" type="email" required value="admin@stocksmart.local">
<label>Password</label><input id="password" type="password" required value="admin123">
<button type="submit" style="width:100%">Sign in</button></form><div id="status" class="status"></div>
<small>Demo: admin / manager / warehouse / cashier / customer (password: role123)</small>
</section></main>
<script src="api.js"></script><script>
document.getElementById("loginForm").addEventListener("submit", async e=>{
 e.preventDefault();
 const status=document.getElementById("status"); status.textContent="";
 try {
   const result=await api("/api/login",{method:"POST",body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
   localStorage.setItem("stocksmart_token",result.token); localStorage.setItem("stocksmart_role",result.role); localStorage.setItem("stocksmart_name",result.full_name); localStorage.setItem("stocksmart_user_id",result.user_id);
   const pages={admin:"admin.html",manager:"manager.html",warehouse:"warehouse.html",cashier:"cashier.html",customer:"store.html"};
   location.href=pages[result.role];
 } catch(err){ status.textContent=err.message; }
});
</script></body></html>
